{% extends "base.html" %}
{% block title %}Accounts - Telegram Manager{% endblock %}
{% block content %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1><i class="fas fa-users"></i> Telegram Accounts</h1>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addAccountModal"><i class="fas fa-plus"></i> Add Account</button>
    </div>
    <div class="row" id="accountsList"></div>
</div>
<div class="modal fade" id="addAccountModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Add New Account</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <div class="mb-3"><label class="form-label">Account Name</label><input type="text" class="form-control" id="accountName" placeholder="My Account"></div>
                <div class="mb-3"><label class="form-label">Phone Number</label><input type="tel" class="form-control" id="accountPhone" placeholder="+1234567890"></div>
            </div>
            <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button type="button" class="btn btn-primary" onclick="addAccount()">Add Account</button></div>
        </div>
    </div>
</div>
<script>
function loadAccounts() {
    $.ajax({
        url: '/api/accounts',
        method: 'GET',
        success: function(accounts) {
            const container = $('#accountsList');
            container.empty();
            if (accounts.length === 0) {
                container.html('<div class="col-12"><p class="text-muted text-center py-5">No accounts added yet</p></div>');
                return;
            }
            accounts.forEach(account => {
                const statusBadge = account.is_active ? '<span class="badge bg-success">Active</span>' : '<span class="badge bg-secondary">Inactive</span>';
                const html = `<div class="col-md-6 mb-4"><div class="card"><div class="card-body"><div class="d-flex justify-content-between align-items-start mb-3"><div><h5 class="card-title mb-2">${account.name}</h5><p class="text-muted mb-0"><small><i class="fas fa-phone"></i> ${account.phone}</small></p></div>${statusBadge}</div>${account.user_id ? `<p class="text-muted"><small>ID: ${account.user_id}</small></p>` : '<p class="text-danger"><small>Not authenticated</small></p>'}<button class="btn btn-sm btn-outline-danger" onclick="deleteAccount(${account.id})"><i class="fas fa-trash"></i> Delete</button></div></div></div>`;
                container.append(html);
            });
        }
    });
}
function addAccount() {
    const name = $('#accountName').val();
    const phone = $('#accountPhone').val();
    if (!name || !phone) {
        alert('Please fill in all fields');
        return;
    }
    alert('Account added! (API integration required)');
    loadAccounts();
}
function deleteAccount(id) {
    if (confirm('Delete this account?')) {
        alert('Account deleted!');
        loadAccounts();
    }
}
loadAccounts();
</script>
{% endblock %}
