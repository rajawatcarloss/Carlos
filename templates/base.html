<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Telegram Manager{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary-color: #0088cc; --secondary-color: #1f2937; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .navbar { background: linear-gradient(135deg, #0088cc 0%, #0066aa 100%); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .navbar-brand { font-weight: 700; font-size: 24px; }
        .card { border: none; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: all 0.3s; }
        .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
        .card-header { background: linear-gradient(135deg, #0088cc 0%, #0066aa 100%); color: white; border: none; font-weight: 600; }
        .btn-primary { background-color: var(--primary-color); border-color: var(--primary-color); }
        .btn-primary:hover { background-color: #0066aa; border-color: #0066aa; }
        .stat-value { font-size: 32px; font-weight: 700; color: #0088cc; }
        .container-main { margin-top: 30px; margin-bottom: 30px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"><i class="fas fa-paper-plane"></i> Telegram Manager</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/"><i class="fas fa-chart-line"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/accounts"><i class="fas fa-users"></i> Accounts</a></li>
                    <li class="nav-item"><a class="nav-link" href="/groups"><i class="fas fa-layer-group"></i> Groups</a></li>
                    <li class="nav-item"><a class="nav-link" href="/sender"><i class="fas fa-envelope"></i> Sender</a></li>
                    <li class="nav-item"><a class="nav-link" href="/repeater"><i class="fas fa-redo"></i> Repeater</a></li>
                    <li class="nav-item"><a class="nav-link" href="/logs"><i class="fas fa-scroll"></i> Logs</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container-fluid container-main">{% block content %}{% endblock %}</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
