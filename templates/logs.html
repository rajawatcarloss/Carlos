{% extends "base.html" %}
{% block title %}Logs - Telegram Manager{% endblock %}
{% block content %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1><i class="fas fa-scroll"></i> Activity Logs</h1>
        <div><button class="btn btn-success"><i class="fas fa-download"></i> Export</button></div>
    </div>
    <div class="card"><div class="card-body mb-3"><input type="text" class="form-control" placeholder="Search logs..."></div><div class="table-responsive"><table class="table mb-0"><thead><tr><th>Timestamp</th><th>Account</th><th>Action</th><th>Status</th><th>Message</th></tr></thead><tbody id="logsTable"></tbody></table></div></div>
</div>
<script>
$.ajax({
    url: '/api/logs',
    method: 'GET',
    success: function(logs) {
        const table = $('#logsTable');
        if (logs.length === 0) {
            table.html('<tr><td colspan="5" class="text-center text-muted py-4">No logs yet</td></tr>');
            return;
        }
        logs.forEach(log => {
            const statusColor = log.status === 'success' ? 'success' : 'danger';
            const row = `<tr><td><small>${log.timestamp}</small></td><td>${log.account_name || '-'}</td><td><small>${log.action}</small></td><td><span class="badge bg-${statusColor}">${log.status}</span></td><td><small>${log.message}</small></td></tr>`;
            table.append(row);
        });
    }
});
</script>
{% endblock %}
