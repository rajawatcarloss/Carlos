{% extends "base.html" %}
{% block title %}Settings - Telegram Manager{% endblock %}
{% block content %}
<div class="container">
    <h1 class="mb-4"><i class="fas fa-cog"></i> Settings</h1>
    <div class="row">
        <div class="col-lg-8">
            <div class="card"><div class="card-header">Telegram API Settings</div><div class="card-body"><div class="mb-3"><label class="form-label">API ID</label><input type="text" class="form-control" placeholder="Get from https://my.telegram.org"></div><div class="mb-3"><label class="form-label">API Hash</label><input type="text" class="form-control" placeholder="Get from https://my.telegram.org"></div><button class="btn btn-primary"><i class="fas fa-save"></i> Save Settings</button></div></div>
        </div>
    </div>
</div>
{% endblock %}
