{% extends "base.html" %}
{% block title %}Sender - Telegram Manager{% endblock %}
{% block content %}
<div class="container">
    <h1 class="mb-4"><i class="fas fa-envelope"></i> Send Messages</h1>
    <div class="row">
        <div class="col-lg-8">
            <div class="card"><div class="card-header">Compose Message</div><div class="card-body"><div class="mb-3"><label class="form-label">Message Text</label><textarea class="form-control" rows="6" placeholder="Enter your message here..."></textarea></div><div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="randomDelay"><label class="form-check-label" for="randomDelay">Random Delay Between Messages</label></div><button class="btn btn-primary w-100"><i class="fas fa-paper-plane"></i> Send Messages</button></div></div>
        </div>
    </div>
</div>
{% endblock %}
